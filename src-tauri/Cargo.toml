[package]
name = "stack-app"
version = "0.1.0"
description = "escacs stack desktop shell (Tauri 2)"
edition = "2021"
rust-version = "1.85"

[lib]
name = "stack_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dev builds keep dependencies optimized (EscacsCode profile).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
